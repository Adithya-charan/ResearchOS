description: >
  Smoke-test configuration (~0.5M parameters) that finishes in about a minute on CPU.
model:
  vocab_size: auto
  max_seq_len: 128
  d_model: 96
  n_layers: 3
  n_heads: 4
  d_ff: 384
  dropout: 0.0
training:
  run_name: tiny_cpu
  seed: 1
  batch_size: 8
  grad_accum_steps: 1
  max_steps: 200
  learning_rate: 0.002
  warmup_steps: 20
  eval_interval: 50
  eval_batches: 10
  checkpoint_interval: 100
  log_interval: 10
  mixed_precision: none
  device: cpu
data:
  processed_dir: datasets/processed/synthetic_v1
  tokenizer_dir: artifacts/tokenizer
