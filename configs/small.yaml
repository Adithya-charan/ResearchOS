description: >
  Blueprint starter configuration (~6M parameters). First real run on the synthetic corpus.
model:
  vocab_size: auto          # taken from the trained tokenizer
  max_seq_len: 256
  d_model: 256
  n_layers: 6
  n_heads: 8
  d_ff: 1024
  dropout: 0.1
  normalization: layer_norm
  positional_encoding: learned
  mlp: gelu
  tie_embeddings: true
  attention_impl: sdpa      # numerically equal to "manual" (tested); faster on GPU
training:
  run_name: small_v1
  seed: 42
  batch_size: 16
  grad_accum_steps: 2
  max_steps: 3000
  learning_rate: 0.0006
  min_lr_ratio: 0.1
  weight_decay: 0.1
  warmup_steps: 150
  grad_clip_norm: 1.0
  eval_interval: 250
  eval_batches: 40
  checkpoint_interval: 500
  keep_last: 3
  log_interval: 25
  mixed_precision: auto
  activation_checkpointing: false
  early_stopping_patience: 6
data:
  processed_dir: datasets/processed/synthetic_v1
  tokenizer_dir: artifacts/tokenizer
