description: >
  CPU_DEBUG profile (~0.14M parameters): pipeline debugging and CI-sized smoke runs. Not a useful language model.
  Kept in step with model/profiles.py by tests/test_p8_model.py.
model:
  vocab_size: auto
  max_seq_len: 64
  d_model: 64
  n_layers: 2
  n_heads: 4
  d_ff: 256
  dropout: 0.0
training:
  run_name: cpu_debug
  seed: 1
  batch_size: 4
  grad_accum_steps: 1
  max_steps: 60
  learning_rate: 0.003
  warmup_steps: 5
  eval_interval: 20
  eval_batches: 5
  checkpoint_interval: 30
  log_interval: 10
  mixed_precision: none
  device: cpu
data:
  processed_dir: datasets/processed/synthetic_v1
  tokenizer_dir: artifacts/tokenizer
