# Alembic CLI configuration.  Examples:
#   alembic upgrade head
#   alembic revision --autogenerate -m "describe the change"
# The database comes from RESEARCHOS_DATABASE_URL (same as the API). The app applies migrations itself on startup.
[alembic]
script_location = api/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
