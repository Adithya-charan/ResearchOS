name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -e ".[dev,api,corpus,postgres]"
      - name: Run test suite
        run: python -m pytest

  postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust   # throwaway CI database, reachable only from this job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      RESEARCHOS_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -e ".[dev,api,corpus,postgres]"
      - name: PostgreSQL integration tests (real server, no mocks)
        run: python -m pytest tests/test_p7_postgres.py
      - name: Existing API, engine and agent tests, run on PostgreSQL
        env:
          RESEARCHOS_TEST_ON_POSTGRES: "1"
        run: >-
          python -m pytest tests/test_api.py tests/test_api_corpus.py tests/test_api_experiments.py tests/test_api_models.py
          tests/test_api_reports.py tests/test_api_sse.py tests/test_jobs.py tests/test_p3_execution.py tests/test_p4_agents.py
          tests/test_p5_closure.py tests/test_p5_knowledge.py tests/test_p6_evidence.py tests/test_research_workflow.py
          tests/test_corpus_agents.py tests/test_experiments.py tests/test_agent_engine.py tests/test_agent_workflow.py
          --deselect tests/test_agent_state.py
      - name: Validate the PostgreSQL compose files
        run: POSTGRES_PASSWORD="$(openssl rand -hex 16)" docker compose -f docker-compose.yml -f docker-compose.postgres.yml config -q

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No large or binary model artifacts committed
        run: |
          if git ls-files | grep -E '\.(safetensors|pt|bin|db|sqlite3)$'; then
            echo "model weights, tensors and databases must not be committed"; exit 1
          fi
      - name: No oversized files
        run: |
          big=$(git ls-files -z | xargs -0 du -k | awk '$1 > 5120 {print $2}')
          if [ -n "$big" ]; then echo "files over 5 MB:"; echo "$big"; exit 1; fi

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config -q
      - name: Build image
        run: docker build -t researchos-api:ci .
      - name: Run container as a non-root user and check health
        run: |
          docker run -d --name api -p 8000:8000 --read-only --tmpfs /tmp --cap-drop ALL             --security-opt no-new-privileges:true -v ci-data:/data researchos-api:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health
          test "$(docker exec api id -u)" = "10001"
          docker logs api | tail -20
      - name: Register and sign in through the container
        run: |
          curl -fsS -c jar -H 'Content-Type: application/json'             -d '{"email":"ci@example.org","password":"correct horse battery 42"}' http://127.0.0.1:8000/auth/register
          curl -fsS -b jar http://127.0.0.1:8000/auth/me
